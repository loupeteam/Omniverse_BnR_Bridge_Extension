[core]
reloadable = true
order = 0

[package]
version = "0.3.0"
category = "simulation"
title = "B&R Bridge"
description = "B&R PLC driver for the loupe.simulation.bridge framework: OMJSON over websockets"
authors = ["Loupe"]
repository = "https://github.com/loupeteam/Omniverse_BnR_Bridge_Extension"
keywords = ["B&R", "Digital Twin", "Websockets", "PLC"]
changelog = "docs/CHANGELOG.md"
readme = "docs/README.md"
preview_image = "data/preview.png"
icon = "data/icon.png"

[dependencies]
# The framework owns everything a simulation touches (/PLC prims, the System,
# the window, the message bus, the USD mirror); this extension only registers
# the B&R driver with it. Any 0.3.x of the framework.
"loupe.simulation.bridge" = { version = "0.3" }
# Installs the pip requirements below before this extension starts. Without it
# an app that enables only this extension never starts pipapi and the import of
# br_bridge fails.
"omni.kit.pipapi" = {}

[python.pipapi]
# The OMJSON driver is the plain-Python br-bridge package (br_bridge/ at this
# repo's root) on top of websockets. plc-bridge, which br-bridge builds on, is
# pinned by the framework extension: Kit installs every extension's pip
# requirements into one site-packages and does not resolve conflicts, so a
# vendor extension pins only its own library.
requirements = ["websockets", "br-bridge>=0.3.0,<0.4"]
# What to import to decide whether a requirement is already satisfied. pipapi
# tries this import first and calls pip only when it fails, so a checkout
# installed editable into Kit's Python (Omni-Utils tools/dev_link.py --driver)
# takes precedence over the wheels below. A submodule rather than the package:
# Kit has its working directory on sys.path, and from this repo's root the bare
# br_bridge/ folder imports as an empty namespace package, which would pass a
# package-level check and skip the install.
modules = ["websockets", "br_bridge.driver"]
# Until br-bridge is on PyPI its wheel ships in wheels/ in the extension folder
# (relative to it); tools/build_wheels.py fills it, with the plc-bridge and
# websockets wheels the install needs alongside. pip tries the archive first
# with --no-index, then the online index.
archiveDirs = ["wheels"]
use_online_index = true

[[python.module]]
name = "loupe.simulation.br_bridge"
public = true

[[test]]
# Extra dependencies only to be used during test run
dependencies = [
    "omni.kit.ui_test", # UI testing extension
]
timeout = 60
